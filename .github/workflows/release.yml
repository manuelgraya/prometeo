# Al subir una etiqueta vX.Y.Z: compila el frontend, crea prometeo-windows.zip y publica la release
# con install.ps1. Es lo que descarga el instalador de Windows (releases/latest).
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Empaquetar
        run: python3 scripts/empaquetar.py --version "${GITHUB_REF_NAME#v}" --salida dist/prometeo-windows.zip

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/prometeo-windows.zip install.ps1 --title "PROMETEO $GITHUB_REF_NAME" --generate-notes
